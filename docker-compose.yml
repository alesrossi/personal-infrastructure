services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    labels:
      - com.github.nginx-proxy.nginx=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - proxy

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: alessandro0024@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/acme:/etc/acme.sh
    networks:
      - proxy

  portfolio:
    image: alesrossi/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: alessandrorossi.tech,www.alessandrorossi.tech
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: alessandrorossi.tech,www.alessandrorossi.tech
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
    expose:
      - "80"
    networks:
      - proxy

  umami_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - proxy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami_db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      VIRTUAL_HOST: umami.felinoir.it
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: umami.felinoir.it
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
    expose:
      - "3000"
    depends_on:
      umami_db:
        condition: service_healthy
    networks:
      - proxy

networks:
  proxy:
    name: proxy

volumes:
  umami_data:
