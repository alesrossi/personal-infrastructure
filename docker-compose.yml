services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    labels:
      - com.github.nginx-proxy.nginx=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: alessandro0024@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/vhost.d:/etc/nginx/vhost.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/acme:/etc/acme.sh

  portfolio:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
    image: personal-infrastructure/portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      VIRTUAL_HOST: alessandrorossi.tech,www.alessandrorossi.tech
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: alessandrorossi.tech,www.alessandrorossi.tech
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
    expose:
      - "3000"

  cinema:
    image: alesrossi/cinema:latest
    container_name: cinema
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      VIRTUAL_HOST: cinema-roma.alessandrorossi.tech
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: cinema-roma.alessandrorossi.tech
      LETSENCRYPT_EMAIL: alessandro0024@gmail.com
    expose:
      - "3000"
    volumes:
      - cinema-data:/app/data

  cinema-scraper:
    image: alesrossi/cinema:latest
    container_name: cinema-scraper
    restart: unless-stopped
    command: >
      sh -c "npm run scrape &&
              while true; do                                                                                                                                                                                                       
                sleep 86400
                npm run scrape                                                                                                                                                                                                     
              done"
    volumes:
      - cinema-data:/app/data

volumes:
  cinema-data: